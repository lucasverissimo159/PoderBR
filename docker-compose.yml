version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://poderbr:securepassword@db:5432/poderbr
      - CORS_ORIGINS=http://localhost:5173
      - LOG_LEVEL=INFO
      - RATE_LIMIT_DEFAULT=100/minute
    depends_on:
      db:
        condition: service_healthy
    # Read-only filesystem for security hardening, with specific tmpfs mounts for temp files
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=poderbr
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=poderbr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poderbr -d poderbr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
