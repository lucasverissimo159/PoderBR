[project]
name = "poderbr"
version = "0.1.0"
description = "PoderBR - Brazilian Purchasing Power Intelligence Platform"
authors = [
    {name = "PoderBR Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pandas>=2.2.0",
    "httpx>=0.26.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.2.1",
    "black>=24.1.1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ['py311']
