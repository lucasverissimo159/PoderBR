name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pip-audit

    - name: Security Audit
      run: |
        pip-audit --desc

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Format check with black
      run: |
        black --check .

    - name: Test Backend with pytest
      run: |
        pytest

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: app/frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd app/frontend
        npm ci

    - name: Build Frontend
      run: |
        cd app/frontend
        npm run build

    - name: Test Frontend (Unit)
      run: |
        cd app/frontend
        npm run test

    - name: Run E2E Tests (Playwright)
      run: |
        cd app/frontend
        npx playwright install --with-deps
        npx playwright test
